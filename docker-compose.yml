services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/reddot-frontend:latest
    build:
      context: .
      target: frontend
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_USERNAME:-local}/reddot-api:latest
    build:
      context: .
      target: api
    environment:
      NODE_ENV: production
      PORT: 3001
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8082}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: reddot
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: reddot
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reddot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: reddot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reddot -d reddot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
